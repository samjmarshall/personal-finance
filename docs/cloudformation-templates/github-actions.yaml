# Deployer role that .github/workflows/deploy.yml assumes via GitHub OIDC.
# Deployed once by hand — see docs/infrastructure.md. The GitHub IdP already
# exists in the account (one per URL), so it is a parameter, not a resource.
#
#   aws cloudformation deploy \
#     --stack-name personal-finance-github-actions \
#     --template-file docs/cloudformation-templates/github-actions.yaml \
#     --capabilities CAPABILITY_IAM \
#     --parameter-overrides \
#       GitHubOidcProviderArn=arn:aws:iam::139035987018:oidc-provider/token.actions.githubusercontent.com
#
# Trust scopes on the immutable `sub`. Two facts force this exact shape:
#   1. IAM requires a GitHub OIDC trust to scope on `sub` or `job_workflow_ref`
#      ("must evaluate ... :sub or :job_workflow_ref which is not scoped to all").
#      `repository_id` may only be an *extra* condition, never the sole scope.
#   2. STS in this account does NOT evaluate `job_workflow_ref` at assume-time
#      (an assume with a provably-matching job_workflow_ref value still denied),
#      so `sub` is the only claim that actually works here.
# GitHub mints this repo's `sub` in immutable id form
# (`repo:<org>@<orgId>/<repo>@<repoId>:...`) — verified from a decoded token — so
# the two numeric ids are unavoidable. They are stable: unchanged by rename or
# transfer. Get them with: gh api repos/samjmarshall/personal-finance --jq '.owner.id, .id'
Parameters:
  GitHubOrg:
    Description: GitHub organization slug (case sensitive)
    Type: String
    Default: samjmarshall
  GitHubOrgId:
    Description: Numeric GitHub org/owner id (owner.id from the repos API), for the immutable sub claim
    Type: String
    Default: "8191402"
  RepositoryName:
    Description: GitHub repository name (case sensitive)
    Type: String
    Default: personal-finance
  RepositoryId:
    Description: Numeric GitHub repository id (.id from the repos API), for the immutable sub claim
    Type: String
    Default: "1329348861"
  GitHubOidcProviderArn:
    Description: ARN of the account's existing token.actions.githubusercontent.com OIDC provider
    Type: String

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}@${GitHubOrgId}/${RepositoryName}@${RepositoryId}:*
      # Terraform creates IAM roles and policies from this role, so a scoped policy
      # would need iam:* anyway. Matches the reference stack.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  Role:
    Description: Store as the DEPLOYER_ROLE_ARN GitHub variable
    Value: !GetAtt Role.Arn
