name: Deployment

# The only deploy path. Vercel's git auto-deploy is off (vercel.json), so every
# push to every branch lands here: terraform apply creates the Vercel deployment.
# `main` → production; anything else → the shared preview state (last apply wins,
# deployments are never deleted). Migrations are NOT run here: they run in
# post-deploy.yml as the "DB Migration" Deployment Check, fired by Vercel's
# `vercel.deployment.ready` dispatch, which gates production promotion.
on: push

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # id-token lets configure-aws-credentials mint the GitHub OIDC token the
    # deployer role trusts (docs/cloudformation-templates/github-actions.yaml).
    permissions:
      id-token: write
      contents: read
      deployments: write
    # One apply per branch at a time, never cancelled: a killed apply leaves the
    # state lock held and the shared preview state half-written.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
      url: ${{ steps.apply.outputs.url }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Branch name, not SHA: Vercel stamps it as meta.githubCommitRef, which is
      # what the Neon integration names the `preview/<branch>` database after and
      # what teardown.yml matches on. The SHA only forces a fresh deployment per
      # push (terraform_data.deploy_sha in infrastructure/vercel.tf).
      TF_VAR_deploy_ref: ${{ github.ref_name }}
      TF_VAR_deploy_sha: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      # The default wrapper echoes stdout, which corrupts `$(terraform output -raw)`.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform cache
        uses: actions/cache@v4
        with:
          path: infrastructure/.terraform/providers
          key: terraform-${{ hashFiles('infrastructure/.terraform.lock.hcl') }}

      - name: Terraform apply
        id: apply
        run: |
          make apply env="$ENVIRONMENT"
          echo "url=$(terraform -chdir=infrastructure output -raw app_url)" >> "$GITHUB_OUTPUT"
