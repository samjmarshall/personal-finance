name: Deployment

# The only deploy path. Vercel's git auto-deploy is off (vercel.json), so every
# push to every branch lands here. The staged flow is split across five dependent
# jobs so each stage is separately visible and re-runnable:
#
#   terraform-apply ──▶ deploy ──▶ db-migration ──▶ health-check ──▶ promote
#      (all refs)       (all)        (all)          (main only)      (main only)
#
#   terraform-plan  (branches only, alongside; plans PRODUCTION, comments on the PR)
#
# Preview just deploys + migrates. For `main` (production) the staged, un-aliased
# deployment is gated on /api/health (behind the protection-bypass header) and only
# then `vercel promote`d onto the domain — so the alias never lands on an
# un-migrated build. A failed migrate fails the pipeline before health-check/promote;
# the previous production deployment stays Current. Migrations are expand-only (old
# Current code runs against the new schema during the gate window).
#
# Secrets never cross a job boundary (GitHub scrubs secret-bearing job outputs, see
# .github/actions/neon-db-url/action.yml): db-migration re-derives the DB URL from
# the non-secret branch_id via the neon-db-url action, and health-check re-reads the
# protection-bypass secret from `terraform output`. Only non-secret app_url /
# deployment_url pass between jobs.
on: push

# One deploy per branch at a time, never cancelled: a killed apply leaves the state
# lock held and the shared preview state half-written. Workflow-level so the whole
# pipeline (all five jobs) is a single unit per branch.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
  # Pin the Vercel CLI so a CLI release never silently changes deploy/promote
  # behaviour mid-flow.
  VERCEL_CLI: vercel@59.15.1

jobs:
  # Infra only — no deployment resource, no alias wait. Production also publishes the
  # promoted-domain app_url for the promote job's environment URL. The bypass secret
  # is deliberately NOT an output (GitHub would scrub it to empty); health-check
  # re-reads it from Terraform instead.
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # id-token lets configure-aws-credentials mint the GitHub OIDC token the
    # deployer role trusts (docs/cloudformation-templates/github-actions.yaml).
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Terraform's vercel provider reads VERCEL_API_TOKEN (team + project ids are
      # non-secret and live in vars). The CLI vars are not needed here.
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The posthog provider reads it in both envs, even where preview owns no PostHog resources.
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      TF_VAR_posthog_key: ${{ secrets.POSTHOG_KEY }}
      TF_VAR_posthog_project_id: ${{ vars.POSTHOG_PROJECT_ID }}
    outputs:
      app_url: ${{ steps.apply.outputs.app_url }}
    steps:
      - uses: actions/checkout@v6

      # The default wrapper echoes stdout, which corrupts `$(terraform output -raw)`.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform cache
        uses: actions/cache@v4
        with:
          path: infrastructure/.terraform/providers
          key: terraform-${{ hashFiles('infrastructure/.terraform.lock.hcl') }}

      - name: Terraform apply
        id: apply
        run: |
          make apply env="$ENVIRONMENT"
          if [ "$ENVIRONMENT" = "production" ]; then
            echo "app_url=$(terraform -chdir=infrastructure output -raw app_url)" >> "$GITHUB_OUTPUT"
          fi

  # Branches only. Plans this branch against PRODUCTION state and posts the diff on
  # its PR, so the production change is reviewed before main applies it. Read-only
  # and off the critical path: no needs, nothing needs it.
  terraform-plan:
    name: Production Plan
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
      # tfcmt posts the comment and sets its plan-result labels on the PR.
      pull-requests: write
      issues: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      GITHUB_TOKEN: ${{ github.token }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      TF_VAR_posthog_key: ${{ secrets.POSTHOG_KEY }}
      TF_VAR_posthog_project_id: ${{ vars.POSTHOG_PROJECT_ID }}
      # Terraform already redacts it, but tfcmt posts plan output verbatim and
      # Actions log masking doesn't reach PR comments.
      TFCMT_MASKS: env:TF_VAR_posthog_key
    steps:
      - uses: actions/checkout@v6

      # Push events carry no PR number. No open PR: the plan still runs but posts
      # nothing. PR opened after the last push? Re-run this job.
      - name: Find PR
        id: pr
        run: echo "number=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      # The wrapper echoes extra output that tfcmt would parse as plan output.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: shmokmt/actions-setup-tfcmt@v2

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Restore-only: terraform-apply, running alongside, is the cache writer.
      - name: Terraform cache
        uses: actions/cache/restore@v4
        with:
          path: infrastructure/.terraform/providers
          key: terraform-${{ hashFiles('infrastructure/.terraform.lock.hcl') }}

      - name: Production plan diff
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: make plan env=production pr="$PR"

  deploy:
    name: Deploy
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      # Owns the GitHub environment record: preview → Preview (deployment_url);
      # production → a staged Production record that promote later re-owns with the
      # custom domain (the staged URL is behind SSO).
      deployments: write
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      # The CLI reads VERCEL_TOKEN and is scoped by VERCEL_ORG_ID / VERCEL_PROJECT_ID
      # (team + project ids are non-secret, so they live in vars, like teardown.yml).
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: make install

      # Stdout is just the deployment URL (CLI writes progress to stderr).
      # --meta githubCommitRef is load-bearing: the Neon integration names the DB
      # branch preview/<ref> after it and teardown.yml deletes by it. Production
      # stages un-aliased (--prod --skip-domain); promote moves the domain later.
      - name: Vercel deploy
        id: deploy
        run: |
          args=(deploy --token="$VERCEL_TOKEN" --yes \
            --meta "githubCommitRef=${GITHUB_REF_NAME}" \
            --meta "githubCommitSha=${GITHUB_SHA}")
          if [ "$ENVIRONMENT" = "production" ]; then
            args+=(--prod --skip-domain)
          fi
          url="$(pnpm dlx "$VERCEL_CLI" "${args[@]}" | tail -n1)"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

  db-migration:
    name: DB Migration
    needs: [deploy]
    runs-on: ubuntu-latest
    # The seq 1 20 × sleep 15 Neon poll alone is up to ~5m.
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: make install

      # The CLI deploy triggers Neon provisioning, so a fresh preview branch may not
      # exist yet (this job needs: deploy for that ordering) — poll the branches API
      # until it appears, then fail loud. branch_id is NOT a secret: the DB URLs are
      # re-derived from it below (they embed the password) instead of crossing a job
      # boundary.
      - name: Resolve Neon branch
        id: neon
        run: |
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          for attempt in $(seq 1 20); do
            branches="$(curl -s -H "Authorization: Bearer $NEON_API_KEY" "$api")"
            if [ "$ENVIRONMENT" = "production" ]; then
              branch_id="$(echo "$branches" | jq -r '.branches[] | select(.primary == true) | .id' 2>/dev/null)"
            else
              branch_id="$(echo "$branches" | jq -r --arg ref "preview/$GITHUB_REF_NAME" \
                '.branches[] | select(.name == $ref) | .id' 2>/dev/null)"
            fi
            if [ -n "$branch_id" ]; then
              echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Neon branch not ready (attempt $attempt/20), retrying in 15s…"
            sleep 15
          done
          echo "::error::Could not resolve Neon branch for 'preview/$GITHUB_REF_NAME' (environment '$ENVIRONMENT') after polling. Failing at the source so the cause is one clear error, not a wall of downstream connection failures."
          exit 1

      - name: Resolve database URLs
        id: dburl
        uses: ./.github/actions/neon-db-url
        with:
          neon_api_key: ${{ secrets.NEON_API_KEY }}
          neon_project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_id: ${{ steps.neon.outputs.branch_id }}

      # Catches journal/snapshot collisions before anything is applied.
      - name: Run database check
        run: make db_check
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL_UNPOOLED: ${{ steps.dburl.outputs.db_url_unpooled }}

      # Unpooled: DDL must not go through PgBouncer. One transaction — any failure
      # fails the job here, which skips health-check/promote, leaving the old
      # deployment Current.
      - name: Run database migrations
        run: make db_migrate
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL_UNPOOLED: ${{ steps.dburl.outputs.db_url_unpooled }}

  # Gate: the staged production deployment must report healthy against the
  # freshly-migrated DB before it takes the domain. Production only.
  health-check:
    name: Health Check
    needs: [deploy, db-migration]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # id-token: AWS OIDC is needed to init the S3 backend and read the bypass secret
    # from Terraform state — the secret can't cross a job boundary as an output.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Restore-only: terraform-apply is the cache writer, and it has already run.
      - name: Terraform cache
        uses: actions/cache/restore@v4
        with:
          path: infrastructure/.terraform/providers
          key: terraform-${{ hashFiles('infrastructure/.terraform.lock.hcl') }}

      # Re-read the bypass secret from Terraform state (it never crossed the job
      # boundary) and mask it immediately.
      - name: Read protection-bypass secret
        id: bypass
        run: |
          make init env=production
          BYPASS="$(terraform -chdir=infrastructure output -raw protection_bypass_secret)"
          echo "::add-mask::$BYPASS"
          echo "bypass=$BYPASS" >> "$GITHUB_OUTPUT"

      # The staged deployment is behind Deployment Protection (SSO), so reach it with
      # the bypass header. Retry briefly for cold start; a non-200 fails the job and
      # the old deployment stays Current.
      - name: Health gate
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          BYPASS: ${{ steps.bypass.outputs.bypass }}
        run: |
          for attempt in $(seq 1 5); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "x-vercel-protection-bypass: $BYPASS" \
              "$DEPLOYMENT_URL/api/health" || echo 000)"
            if [ "$status" = "200" ]; then
              echo "Health gate passed (200)."
              exit 0
            fi
            echo "Health gate got $status (attempt $attempt/5), retrying in 10s…"
            sleep 10
          done
          echo "::error::Health gate failed — /api/health did not return 200. Refusing to promote; the previous deployment stays Current."
          exit 1

  # Moves the domain onto the gated staged deployment. Production only; runs only
  # after health-check succeeds. Publishes the promoted custom domain as the
  # Production environment URL (the staged URL is behind SSO).
  promote:
    name: Promote
    needs: [terraform-apply, deploy, health-check]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      deployments: write
    environment:
      name: Production
      url: ${{ needs.terraform-apply.outputs.app_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: make install

      - name: Vercel promote
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: pnpm dlx "$VERCEL_CLI" promote "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" --yes
