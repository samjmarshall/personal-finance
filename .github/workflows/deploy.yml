name: Deployment

# The only deploy path. Vercel's git auto-deploy is off (vercel.json), so every
# push to every branch lands here: terraform apply creates the Vercel deployment,
# then the matching Neon branch is migrated. `main` → production; anything else →
# the shared preview state (last apply wins, deployments are never deleted).
on: push

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # id-token lets configure-aws-credentials mint the GitHub OIDC token the
    # deployer role trusts (docs/cloudformation-templates/github-actions.yaml).
    permissions:
      id-token: write
      contents: read
      deployments: write
    # One apply per branch at a time, never cancelled: a killed apply leaves the
    # state lock held and the shared preview state half-written.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
      url: ${{ steps.apply.outputs.url }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Branch name, not SHA: Vercel stamps it as meta.githubCommitRef, which is
      # what the Neon integration names the `preview/<branch>` database after and
      # what teardown.yml matches on. The SHA only forces a fresh deployment per
      # push (terraform_data.deploy_sha in infrastructure/vercel.tf).
      TF_VAR_deploy_ref: ${{ github.ref_name }}
      TF_VAR_deploy_sha: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      # The default wrapper echoes stdout, which corrupts `$(terraform output -raw)`.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform cache
        uses: actions/cache@v4
        with:
          path: infrastructure/.terraform/providers
          key: terraform-${{ hashFiles('infrastructure/.terraform.lock.hcl') }}

      - name: Terraform apply
        id: apply
        run: |
          make apply env="$ENVIRONMENT"
          echo "url=$(terraform -chdir=infrastructure output -raw app_url)" >> "$GITHUB_OUTPUT"

  # Migrations run *after* the new code is serving traffic — a failure leaves the
  # schema behind the code, which is why the rollback job below exists.
  migrate:
    name: DB Migration
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Serialise migrations per branch; never cancel one mid-flight.
    concurrency:
      group: migrate-${{ github.ref_name }}
      cancel-in-progress: false
    # NOTE: the database URLs are deliberately NOT job outputs. GitHub silently
    # scrubs any job output whose value contains a registered secret (the Neon
    # URI embeds the role password) → it arrives empty in
    # `needs.migrate.outputs.*`. Only the non-secret branch_id crosses the job
    # boundary; consumers re-derive the URLs from it via the
    # ./.github/actions/neon-db-url composite.
    outputs:
      branch_id: ${{ steps.neon.outputs.branch_id }}
      pre_migrate_timestamp: ${{ steps.pre_migrate.outputs.timestamp }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: make install

      # Preview databases are named `preview/<branch>` by the Neon-Vercel
      # integration, keyed off the deployment's githubCommitRef (= deploy_ref).
      - name: Resolve Neon branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          BRANCHES=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")

          if [ "$ENVIRONMENT" = "production" ]; then
            BRANCH_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.primary == true) | .id')
          else
            BRANCH_ID=$(echo "$BRANCHES" | jq -r --arg ref "preview/$GIT_REF" \
              '.branches[] | select(.name == $ref) | .id')
          fi

          if [ -z "$BRANCH_ID" ]; then
            echo "::error::Could not resolve Neon branch for ref '$GIT_REF' \
          (environment '$ENVIRONMENT'). Failing here at the source so the cause \
          is one clear error, not a wall of downstream connection failures."
            exit 1
          fi

          # branch_id is NOT a secret — it crosses the job boundary safely.
          echo "branch_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve database URLs
        id: dburl
        uses: ./.github/actions/neon-db-url
        with:
          neon_api_key: ${{ secrets.NEON_API_KEY }}
          neon_project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_id: ${{ steps.neon.outputs.branch_id }}

      # Anchor for the production point-in-time restore in the rollback job.
      - name: Record pre-migration timestamp
        id: pre_migrate
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # Catches journal/snapshot collisions before anything is applied.
      - name: Run database check
        run: pnpm run db:check
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL_UNPOOLED: ${{ steps.dburl.outputs.db_url_unpooled }}

      # Unpooled: DDL must not go through PgBouncer.
      - name: Run database migrations
        run: pnpm run db:migrate
        env:
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL_UNPOOLED: ${{ steps.dburl.outputs.db_url_unpooled }}

  # A failed migration can leave the schema partially applied. The branch_id
  # guard means a failure *before* branch resolution skips rollback cleanly —
  # nothing was touched, so there is nothing to undo.
  rollback:
    name: Rollback Migration
    needs: migrate
    if: ${{ failure() && needs.migrate.outputs.branch_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Rollback (preview — reset branch to parent)
        if: ${{ env.ENVIRONMENT != 'production' }}
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ needs.migrate.outputs.branch_id }}
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}

      # `preserve_under_name` is required by Neon when restoring a branch from
      # itself — it keeps the post-migration state around under that name
      # rather than discarding it.
      - name: Rollback (production — point-in-time restore)
        if: ${{ env.ENVIRONMENT == 'production' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ needs.migrate.outputs.branch_id }}
          BEFORE_TS: ${{ needs.migrate.outputs.pre_migrate_timestamp }}
        run: |
          curl -fsS -X POST \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID/restore" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg branch "$BRANCH_ID" \
              --arg ts "$BEFORE_TS" \
              '{source_branch_id:$branch, source_timestamp:$ts,
                preserve_under_name:"pre-migration-backup"}')"
          echo "::warning::Production database restored to pre-migration state ($BEFORE_TS)"
